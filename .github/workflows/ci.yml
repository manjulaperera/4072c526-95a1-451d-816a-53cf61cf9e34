name: Build and Test

on:
  push:
  pull_request:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, format check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CodingTest.sln

      - name: Verify formatting
        run: dotnet format CodingTest.sln --verify-no-changes

      - name: Build
        run: dotnet build CodingTest.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CodingTest.sln --configuration Release --no-build --verbosity normal --logger "console;verbosity=normal"
