name: Build and Test

on:
  push:
  pull_request:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, format check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CodingTest.sln

      - name: Verify formatting
        run: dotnet format CodingTest.sln --verify-no-changes

      - name: Install SonarScanner
        if: vars.SONAR_ENABLED == 'true'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud analysis
        if: vars.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: >
          dotnet sonarscanner begin
          /k:"${SONAR_PROJECT_KEY}"
          /o:"${SONAR_ORGANIZATION}"
          /n:"Coding Exercise"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.sourceEncoding="UTF-8"
          /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/Fixtures/**,**/.specify/**,**/.cursor/**"
          /d:sonar.test.inclusions="**/*Tests/**/*.cs,**/*UnitTests/**/*.cs"
          /d:sonar.coverage.exclusions="**/Program.cs"

      - name: Build
        run: dotnet build CodingTest.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test CodingTest.sln
          --configuration Release
          --no-build
          --verbosity normal
          --logger "console;verbosity=normal"
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: End SonarCloud analysis
        if: vars.SONAR_ENABLED == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults/**/coverage.opencover.xml
          if-no-files-found: warn

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f src/CodingTestCli/Dockerfile -t coding-test-cli .

      - name: Run Docker smoke test
        run: |
          output="$(docker run --rm coding-test-cli "6 1 5 9 2")"
          test "$output" = "1 5 9"
