name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CodingTest.sln

      - name: Verify formatting
        run: dotnet format CodingTest.sln --verify-no-changes

      - name: Build
        run: dotnet build CodingTest.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CodingTest.sln --configuration Release --no-build --verbosity normal
