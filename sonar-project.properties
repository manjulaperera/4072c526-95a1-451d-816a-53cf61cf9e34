# SonarCloud settings (reference). CI uses GitHub Actions variables:
#   SONAR_ORGANIZATION, SONAR_PROJECT_KEY, SONAR_TOKEN, SONAR_ENABLED
#
# The project key MUST match the key shown in SonarCloud under
# Project Settings → Project Information (created when you import the repo).

sonar.projectName=Coding Exercise
sonar.sourceEncoding=UTF-8

# OpenCover reports produced by coverlet during CI test runs
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Focus analysis on production code; exclude generated and test-only paths
sonar.exclusions=**/bin/**,**/obj/**,**/Fixtures/**
sonar.test.inclusions=**/*Tests/**/*.cs,**/*UnitTests/**/*.cs
sonar.coverage.exclusions=**/Program.cs
